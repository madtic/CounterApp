name: counter-app-deploy

# Deployment-only Compose file used by the GitLab shell runner.
# It contains no build sections: the CI job either pulls the images that were
# pushed by the build job or builds them locally as a fallback.
#
# Images and ports are supplied by deploy/deploy.sh.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: counter
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
    volumes:
      - counter-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://counter:counter@db:5432/counter
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  counter-db-data:
