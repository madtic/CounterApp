sonar.projectKey=counter-app
sonar.projectName=Counter Playground
sonar.projectVersion=0.1.0

sonar.sources=backend/app,frontend/src
# Keep the tests root at backend/ so JUnit class names such as
# "tests.test_counter_api" resolve to backend/tests/test_counter_api.py.
sonar.tests=backend
sonar.test.inclusions=backend/tests/**/*.py
sonar.sourceEncoding=UTF-8

# Reports generated by:
#   cd backend
#   uv run pytest --cov=app --cov-report=xml:coverage.xml --junitxml=pytest-report.xml
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/pytest-report.xml

# Source files that should not be analyzed.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.ruff_cache/**,\
  **/coverage/**,\
  **/htmlcov/**,\
  **/*.min.js

# Enable this after adding frontend tests that produce an LCOV report.
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Optional: make the CI job fail when the quality gate fails.
# sonar.qualitygate.wait=true
