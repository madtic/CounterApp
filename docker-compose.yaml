name: counter-demo

services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_HOST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - counter-db-data:/var/lib/postresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.distroless
    ports:
      - "8000:8000"
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-memory}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_Port:-5432}/${DB_HOST}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.distroless
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  counter-db-data: