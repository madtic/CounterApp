services:
  backend:
    command:
      - python3
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend/app:/app/app
