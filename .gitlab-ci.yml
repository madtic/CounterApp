# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- build
- secret-detection

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

backend-test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .cache/uv
  before_script:
    - cd backend
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ty check
    - uv run pytest --cov=app --cov-report=xml:coverage.xml --junitxml=pytest-report.xml --junit-prefix=backend
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/coverage.xml
      - backend/pytest-report.xml

frontend-test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run build

docker-build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  parallel:
    matrix:
      - SERVICE: [backend, frontend]
  before_script:
    - |
      echo "Waiting for the Docker daemon..."
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info >/dev/null
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
      SHA_TAG="$CI_COMMIT_SHORT_SHA"
      REF_TAG="$CI_COMMIT_REF_SLUG"

      docker build --pull \
        --file "./$SERVICE/Dockerfile" \
        --tag "$IMAGE:$SHA_TAG" \
        --tag "$IMAGE:$REF_TAG" \
        "./$SERVICE"

      # Merge request pipelines verify that the image builds, but do not push.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Merge request pipeline: image built but not pushed."
        exit 0
      fi

      echo "$CI_REGISTRY_PASSWORD" | docker login \
        -u "$CI_REGISTRY_USER" \
        --password-stdin "$CI_REGISTRY"

      docker push "$IMAGE:$SHA_TAG"
      docker push "$IMAGE:$REF_TAG"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection