# GitLab CI/CD Pipeline for CounterApp
# Documentation & References:
# - Pipeline Architecture: https://docs.gitlab.com/ci/pipelines/
# - GitLab Application Security: https://docs.gitlab.com/user/application_security/
# - Merge Request Reports: https://docs.gitlab.com/ci/testing/unit_test_reports/

default:
  interruptible: true

workflow:
  name: '$PIPELINE_NAME'
  rules:
    # Merge Request pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PIPELINE_NAME: 'MR !${CI_MERGE_REQUEST_IID}: ${CI_MERGE_REQUEST_TITLE}'
    # Release / Tag pipelines
    - if: '$CI_COMMIT_TAG'
      variables:
        PIPELINE_NAME: 'Release Tag: ${CI_COMMIT_TAG}'
    # Prevent duplicate pipelines when an open MR exists for the branch
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Branch push pipelines
    - if: '$CI_COMMIT_BRANCH'
      variables:
        PIPELINE_NAME: 'Branch: ${CI_COMMIT_BRANCH} - ${CI_COMMIT_TITLE}'

stages:
  - test
  - quality
  - build
  - container-scanning
  - deploy

variables:
  # Package manager caches within project workspace for GitLab Runner persistence
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

  # Security Analyzers Configuration (Best Practice: Exclude non-production directories)
  SECURE_ANALYZERS_PREFIX: "registry.gitlab.com/gitlab-org/security-products/analyzers"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, .venv, node_modules"
  SECRET_DETECTION_EXCLUDED_PATHS: "tests, .venv, node_modules"
  DS_EXCLUDED_PATHS: "tests, .venv, node_modules"

# =============================================================================
# Security Scanning Templates (GitLab Security Dashboard & MR Widgets)
# =============================================================================
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

# Parallelize GitLab security jobs using DAG (needs: []) so they run without waiting
semgrep-sast:
  stage: test
  needs: []

secret_detection:
  stage: test
  needs: []

gemnasium-dependency_scanning:
  stage: test
  needs: []

gemnasium-python-dependency_scanning:
  stage: test
  needs: []

# Disable default generic container scanning job in favor of per-service jobs
container_scanning:
  rules:
    - when: never

# =============================================================================
# Stage: Test
# =============================================================================
lint-scripts:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  needs: []
  script:
    - shellcheck deploy/*.sh sonarqube.sh

backend-test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: []
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .cache/uv
  before_script:
    - cd backend
  script:
    - uv sync --frozen
    # Generate Code Quality report for GitLab MR widget (fix paths relative to project root)
    - uv run ruff check --output-format=gitlab --output-file=gl-codequality.json . || true
    - sed -i 's#"path":"#"path":"backend/#' gl-codequality.json || true
    # Strict linting and type checking
    - uv run ruff check .
    - uv run ty check
    # Run tests with JUnit report, XML Cobertura coverage, and interactive HTML report
    - uv run pytest --cov=app --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-report=term --junitxml=pytest-report.xml --junit-prefix=backend
    # Normalize Cobertura source paths so GitLab MR Coverage Visualization accurately maps diff lines
    - sed -i "s#<source>.*backend/app</source>#<source>${CI_PROJECT_DIR}/backend/app</source>#g" coverage.xml || true
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    expose_as: "Backend Coverage Report"
    reports:
      junit: backend/pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
      codequality: backend/gl-codequality.json
    paths:
      - backend/coverage.xml
      - backend/pytest-report.xml
      - backend/gl-codequality.json
      - backend/htmlcov/

frontend-test:
  stage: test
  image: node:22-alpine
  needs: []
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    expose_as: "Frontend Production Build"
    paths:
      - frontend/dist/

# =============================================================================
# Stage: Quality (SBOM, SonarQube, Snyk)
# =============================================================================
frontend-sbom:
  stage: quality
  image: node:22-alpine
  needs: []
  script:
    - cd frontend
    - npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-file frontend-sbom.cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      cyclonedx: frontend/frontend-sbom.cdx.json
    paths:
      - frontend/frontend-sbom.cdx.json
    expose_as: "Frontend SBOM"

backend-sbom:
  stage: quality
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  needs: []
  script:
    - cd backend
    - uv export --frozen --no-dev --format cyclonedx1.5 -o sbom-backend-cdx.json
    # Export clean requirements.txt for Snyk scanning (avoids compiling in Snyk job)
    - uv export --frozen --no-dev --no-hashes --format requirements.txt -o requirements.txt
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      cyclonedx: backend/sbom-backend-cdx.json
    paths:
      - backend/sbom-backend-cdx.json
      - backend/requirements.txt
    expose_as: "Backend SBOM"

sonarqube:
  stage: quality
  tags:
    - shell
  variables:
    GIT_DEPTH: "0"
  needs:
    - backend-test
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      cd "${CI_PROJECT_DIR}"

      if ! command -v uv >/dev/null 2>&1; then
        echo "ERROR: uv is not installed on the shell runner." >&2
        echo "Install uv: https://docs.astral.sh/uv/getting-started/installation/" >&2
        exit 1
      fi

      if [ ! -f backend/coverage.xml ]; then
        echo "ERROR: backend/coverage.xml was not downloaded from the test job." >&2
        exit 1
      fi

      export SONAR_HOST_URL="${SONAR_HOST_URL:-http://localhost:9000}"

      if [ -n "${SONAR_ORGANIZATION:-}" ]; then
        uv run --project backend pysonar \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.organization="${SONAR_ORGANIZATION}"
      else
        uv run --project backend pysonar -Dsonar.host.url="${SONAR_HOST_URL}"
      fi
  rules:
    - if: "$SONAR_TOKEN"
    - when: manual
      allow_failure: true

.snyk-cli:
  stage: quality
  image: node:22-bookworm-slim
  rules:
    - if: $SNYK_TOKEN

snyk-frontend:
  extends: .snyk-cli
  stage: quality
  needs:
    - job: frontend-test
      artifacts: false
  before_script:
    - npm install --global snyk@1.1308.4 snyk-to-html
  script:
    - cd frontend
    - |
      snyk test --all-projects \
        --json-file-output=../snyk-frontend.json || true
    - snyk-to-html -i ../snyk-frontend.json -o ../snyk-frontend.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - snyk-frontend.json
      - snyk-frontend.html
    expose_as: "Snyk frontend report"

snyk-backend:
  extends: .snyk-cli
  stage: quality
  needs:
    - job: backend-sbom
  before_script:
    - npm install --global snyk@1.1308.4 snyk-to-html
  script:
    - cd backend
    - |
      snyk test --file=requirements.txt --package-manager=pip \
        --json-file-output=../snyk-backend.json || true
    - snyk-to-html -i ../snyk-backend.json -o ../snyk-backend.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - snyk-backend.json
      - snyk-backend.html
    expose_as: "Snyk backend report"

# =============================================================================
# Stage: Build (Docker with BuildKit & Registry Layer Caching)
# =============================================================================
.docker-build-base:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  before_script:
    - |
      echo "Waiting for the Docker daemon..."
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info >/dev/null
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
      SHA_TAG="$CI_COMMIT_SHORT_SHA"
      REF_TAG="$CI_COMMIT_REF_SLUG"

      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login \
          -u "$CI_REGISTRY_USER" \
          --password-stdin "$CI_REGISTRY"
      fi

      # Pull latest image for layer caching
      docker pull "$IMAGE:latest" || true

      # Build with inline cache metadata for faster subsequent CI builds
      docker build --pull \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$IMAGE:latest" \
        --file "./$SERVICE/Dockerfile" \
        --tag "$IMAGE:$SHA_TAG" \
        --tag "$IMAGE:$REF_TAG" \
        "./$SERVICE"

      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        # Push commit SHA image tag (required for Container Scanning in branches and MRs)
        docker push "$IMAGE:$SHA_TAG"

        if [ -n "$CI_COMMIT_BRANCH" ]; then
          docker push "$IMAGE:$REF_TAG"
        fi

        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
        fi
      else
        echo "No registry credentials provided; skipped pushing image."
      fi

docker-build-backend:
  extends: .docker-build-base
  variables:
    SERVICE: backend
  needs:
    - job: backend-test
      artifacts: false

docker-build-frontend:
  extends: .docker-build-base
  variables:
    SERVICE: frontend
  needs:
    - job: frontend-test
      artifacts: false

# =============================================================================
# Stage: Container Scanning
# =============================================================================
container-scanning-backend:
  extends: container_scanning
  stage: container-scanning
  needs: ["docker-build-backend"]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

container-scanning-frontend:
  extends: container_scanning
  stage: container-scanning
  needs: ["docker-build-frontend"]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# =============================================================================
# Stage: Deploy (Environment Tracking & Health Smoke Tests)
# =============================================================================
.deploy-job:
  stage: deploy
  tags:
    - shell
  interruptible: false
  allow_failure: true
  resource_group: counter-app-local
  variables:
    BACKEND_PORT: "8000"
    FRONTEND_PORT: "3000"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: "$CI_COMMIT_BRANCH"
      when: manual
    - if: "$CI_COMMIT_TAG"
      when: manual
    - when: never

deploy:
  extends: .deploy-job
  environment:
    name: local
    url: http://localhost:$FRONTEND_PORT
    on_stop: undeploy
    auto_stop_in: 1 day
    deployment_tier: development
  script:
    - bash deploy/deploy.sh
    - |
      echo "Running post-deployment smoke tests..."
      curl --fail --retry 10 --retry-delay 2 --retry-connrefused "http://localhost:${BACKEND_PORT}/health"
      curl --fail --retry 10 --retry-delay 2 --retry-connrefused "http://localhost:${FRONTEND_PORT}" > /dev/null
      echo "Smoke tests passed: Backend and Frontend are healthy."

undeploy:
  extends: .deploy-job
  environment:
    name: local
    action: stop
  script:
    - bash deploy/undeploy.sh
