# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence

default:
  interruptible: true

workflow:
  rules:
    # Run pipeline on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Prevent duplicate pipelines: do not run branch pipeline if an open merge request exists
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Run on branch push (without open MR) and tags
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - quality
  - build
  - container-scanning
  - deploy

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# Security Scanning (SAST, Secret Detection, Container Scanning)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

sast:
  stage: test
  needs: []

secret_detection:
  stage: test
  needs: []

container_scanning:
  rules:
    - when: never # Base placeholder disabled in favor of per-service scan jobs

lint-scripts:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  needs: []
  script:
    - shellcheck deploy/*.sh sonarqube.sh

backend-test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key:
      files:
        - backend/uv.lock
    paths:
      - .cache/uv
  before_script:
    - cd backend
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ty check
    - uv run pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term --junitxml=pytest-report.xml --junit-prefix=backend
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: backend/pytest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
      - backend/pytest-report.xml

frontend-test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run build

frontend-sbom:
  stage: quality
  image: node:22-alpine
  script:
    - cd frontend
    - npx --yes @cyclonedx/cyclonedx-npm --output-file frontend-sbom.cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      cyclonedx: frontend/frontend-sbom.cdx.json
    paths:
      - frontend/frontend-sbom.cdx.json
    expose_as: "Frontend SBOM"

backend-sbom:
  stage: quality
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    - cd backend
    - uv export --frozen --no-dev --format cyclonedx1.5 -o sbom-backend-cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend/sbom-backend-cdx.json
    expose_as: "Backend SBOM"

sonarqube:
  stage: quality
  tags:
    - shell
  variables:
    GIT_DEPTH: "0"
  needs:
    - backend-test
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      cd "${CI_PROJECT_DIR}"

      if ! command -v uv >/dev/null 2>&1; then
        echo "ERROR: uv is not installed on the shell runner." >&2
        echo "Install uv: https://docs.astral.sh/uv/getting-started/installation/" >&2
        exit 1
      fi

      if [ ! -f backend/coverage.xml ]; then
        echo "ERROR: backend/coverage.xml was not downloaded from the test job." >&2
        exit 1
      fi

      export SONAR_HOST_URL="${SONAR_HOST_URL:-http://localhost:9000}"

      # The coverage report contains the absolute path of backend/app from the
      # test job. Normalize it so the scanner can resolve the files regardless
      # of the runner's build directory.
      sed -i 's#<source>.*</source>#<source>backend/app</source>#' backend/coverage.xml

      if [ -n "${SONAR_ORGANIZATION:-}" ]; then
        uv run --project backend pysonar \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.organization="${SONAR_ORGANIZATION}"
      else
        uv run --project backend pysonar -Dsonar.host.url="${SONAR_HOST_URL}"
      fi
  rules:
    - if: "$SONAR_TOKEN"
    - when: manual
      allow_failure: true

.snyk-cli:
  stage: quality
  image: node:22-bookworm-slim
  rules:
    - if: $SNYK_TOKEN

snyk-frontend:
  extends: .snyk-cli
  stage: quality
  needs: ["frontend-test"]
  before_script:
    - npm install --global snyk snyk-to-html
  script:
    - cd frontend
    - |
      snyk test --all-projects \
        --json-file-output=../snyk-frontend.json || true
    - snyk-to-html -i ../snyk-frontend.json -o ../snyk-frontend.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - snyk-frontend.json
      - snyk-frontend.html
    expose_as: "Snyk frontend report"

snyk-backend:
  extends: .snyk-cli
  stage: quality
  needs: ["backend-test"]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sL https://static.snyk.io/cli/latest/snyk-linux -o /usr/local/bin/snyk
    - chmod +x /usr/local/bin/snyk
    - npm install --global snyk-to-html
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv python install 3.13
  script:
    - cd backend
    - uv export --frozen --no-dev --no-hashes --format requirements.txt -o requirements.txt
    - uv venv --seed --python 3.13 .venv
    - . .venv/bin/activate
    - uv pip install -r requirements.txt
    - |
      snyk test --file=requirements.txt --package-manager=pip \
      --json-file-output=../snyk-backend.json || true
    - snyk-to-html -i ../snyk-backend.json -o ../snyk-backend.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - snyk-backend.json
      - snyk-backend.html
    expose_as: "Snyk backend report"

.docker-build-base:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_BUILDKIT: "1"
  before_script:
    - |
      echo "Waiting for the Docker daemon..."
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info >/dev/null
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$SERVICE"
      SHA_TAG="$CI_COMMIT_SHORT_SHA"
      REF_TAG="$CI_COMMIT_REF_SLUG"

      # Pull latest image for layer caching
      docker pull "$IMAGE:latest" || true

      docker build --pull \
        --cache-from "$IMAGE:latest" \
        --file "./$SERVICE/Dockerfile" \
        --tag "$IMAGE:$SHA_TAG" \
        --tag "$IMAGE:$REF_TAG" \
        "./$SERVICE"

      # Merge request pipelines verify that the image builds, but do not push.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Merge request pipeline: image built but not pushed."
        exit 0
      fi

      echo "$CI_REGISTRY_PASSWORD" | docker login \
        -u "$CI_REGISTRY_USER" \
        --password-stdin "$CI_REGISTRY"

      docker push "$IMAGE:$SHA_TAG"
      docker push "$IMAGE:$REF_TAG"

      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

docker-build-backend:
  extends: .docker-build-base
  variables:
    SERVICE: backend
  needs: ["backend-test"]

docker-build-frontend:
  extends: .docker-build-base
  variables:
    SERVICE: frontend
  needs: ["frontend-test"]

container-scanning-backend:
  extends: container_scanning
  stage: container-scanning
  needs: ["docker-build-backend"]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH'

container-scanning-frontend:
  extends: container_scanning
  stage: container-scanning
  needs: ["docker-build-frontend"]
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH'

.deploy-job:
  stage: deploy
  tags:
    - shell
  interruptible: false
  allow_failure: true
  resource_group: counter-app-local
  variables:
    BACKEND_PORT: "8000"
    FRONTEND_PORT: "3000"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: "$CI_COMMIT_BRANCH"
      when: manual
    - if: "$CI_COMMIT_TAG"
      when: manual
    - when: never

deploy:
  extends: .deploy-job
  environment:
    name: local
    url: http://localhost:$FRONTEND_PORT
    on_stop: undeploy
  script:
    - bash deploy/deploy.sh
    - |
      echo "Running post-deployment smoke tests..."
      curl --fail --retry 10 --retry-delay 2 --retry-connrefused "http://localhost:${BACKEND_PORT}/health"
      curl --fail --retry 10 --retry-delay 2 --retry-connrefused "http://localhost:${FRONTEND_PORT}" > /dev/null
      echo "Smoke tests passed: Backend and Frontend are healthy."

undeploy:
  extends: .deploy-job
  environment:
    name: local
    action: stop
  script:
    - bash deploy/undeploy.sh
