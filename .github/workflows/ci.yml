name: CounterApp CI/CD GitHub

on:
  push:
    branches:
      - '**'      #[ "main", "master", "Vorlesung" ]
    tags:
      - '**'      #[ "main", "master", "Vorlesung" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual deployment action (deploy or undeploy)'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - undeploy

# Keep branch deployments and their cleanup from being cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ===========================================================================
  # Stage: Test & Native GitHub Security Analysis
  # ===========================================================================
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ShellCheck
        run: shellcheck deploy/*.sh sonarqube.sh

  codeql-sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

  secret-detection:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  backend-test:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (Ruff) & Type Check (ty)
        run: |
          uv run ruff check --output-format=github .
          uv run ty check
      - name: Run Pytest with Coverage & JUnit
        run: |
          uv run pytest -v --durations=10 \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term \
            --junitxml=pytest-report.xml \
            --junit-prefix=backend
      - name: Upload Backend Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          retention-days: 7
          path: |
            backend/coverage.xml
            backend/pytest-report.xml
            backend/htmlcov/
      - name: Add backend test and coverage summary
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          junit_path = Path("pytest-report.xml")
          coverage_path = Path("coverage.xml")

          def markdown_cell(value: str) -> str:
              return value.replace("|", "\\|").replace("\n", " ").strip()

          with summary.open("a", encoding="utf-8") as output:
              output.write("## Backend tests and coverage\n\n")
              if junit_path.exists():
                  root = ET.parse(junit_path).getroot()
                  cases = list(root.iter("testcase"))
                  failed = sum(
                      1 for case in cases
                      if case.find("failure") is not None or case.find("error") is not None
                  )
                  skipped = sum(1 for case in cases if case.find("skipped") is not None)
                  passed = len(cases) - failed - skipped
                  output.write("| Tests | Passed | Failed | Skipped |\n")
                  output.write("| ---: | ---: | ---: | ---: |\n")
                  output.write(f"| {len(cases)} | {passed} | {failed} | {skipped} |\n\n")
                  failed_cases = [
                      case for case in cases
                      if case.find("failure") is not None or case.find("error") is not None
                  ]
                  if failed_cases:
                      output.write("### Failed tests\n\n| Test | Message |\n| --- | --- |\n")
                      for case in failed_cases[:20]:
                          issue = case.find("failure")
                          if issue is None:
                              issue = case.find("error")
                          message = (issue.attrib.get("message") or issue.text or "No details").strip()
                          output.write(
                              f"| {markdown_cell(case.attrib.get('classname', '') + '::' + case.attrib.get('name', 'unnamed'))} "
                              f"| {markdown_cell(message[:300])} |\n"
                          )
                      output.write("\n")
              else:
                  output.write("Pytest did not produce a JUnit report; tests may not have started.\n\n")

              if coverage_path.exists():
                  coverage = ET.parse(coverage_path).getroot()
                  line_rate = float(coverage.attrib.get("line-rate", 0)) * 100
                  output.write(f"**Backend line coverage:** {line_rate:.1f}%\n\n")
              else:
                  output.write("Coverage report was not generated.\n\n")

              output.write(
                  "Detailed JUnit and HTML coverage reports are available in the "
                  "`backend-test-reports` workflow artifact.\n\n"
              )
          PY

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        run: |
          npm ci
          npm run build

  # ===========================================================================
  # Stage: Quality (SBOM, SonarQube, Snyk)
  # ===========================================================================
  frontend-sbom:
    name: Frontend SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Frontend SBOM
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-file frontend-sbom.cdx.json
      - name: Upload Frontend SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          retention-days: 7
          path: frontend/frontend-sbom.cdx.json

  backend-sbom:
    name: Backend SBOM & Requirements
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Export Backend SBOM & requirements.txt
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format cyclonedx1.5 -o sbom-backend-cdx.json
          uv export --frozen --no-dev --no-hashes --format requirements.txt -o requirements.txt
      - name: Upload Backend SBOM & Requirements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          retention-days: 7
          path: |
            backend/sbom-backend-cdx.json
            backend/requirements.txt

  sonarqube:
    name: SonarQube Analysis
    runs-on: [self-hosted, linux, x64]
    environment:
      name: quality
    defaults:
      run:
        shell: bash
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch))
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [backend-test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Check if SONAR_TOKEN is configured
        id: check_secret
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SONAR_TOKEN not set; skipping SonarQube analysis."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python 3.13
        if: steps.check_secret.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Download Backend Coverage
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: backend
      - name: Check local runner and SonarQube
        if: steps.check_secret.outputs.enabled == 'true'
        run: |
          echo "::notice title=Runner::Preparing SonarQube analysis on $(hostname)"
          uv --version
          python --version
          sonar_url="${SONAR_HOST_URL%/}"
          status="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "${sonar_url}/api/system/status")"
          printf 'SonarQube status: %s\n' "$status"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <<< "$status"; then
            echo "ERROR: SonarQube is reachable but is not UP." >&2
            exit 1
          fi
      - name: Run pysonar
        if: steps.check_secret.outputs.enabled == 'true'
        run: |
          if [ ! -f backend/coverage.xml ]; then
            echo "ERROR: backend/coverage.xml was not downloaded." >&2
            exit 1
          fi
          echo "::notice title=SonarQube::Analyzing against ${SONAR_HOST_URL}"
          if [ -n "${SONAR_ORGANIZATION:-}" ]; then
            uv run --project backend pysonar \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.organization="${SONAR_ORGANIZATION}"
          else
            uv run --project backend pysonar -Dsonar.host.url="${SONAR_HOST_URL}"
          fi

  snyk-frontend:
    name: Snyk Frontend Scan
    runs-on: ubuntu-latest
    environment:
      name: quality
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 20
    needs: [frontend-test]
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check if SNYK_TOKEN is configured
        id: check_secret
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SNYK_TOKEN not set; skipping Snyk frontend scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Set up Node 22
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies & Run Snyk
        if: steps.check_secret.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npx --yes snyk test --strict-out-of-sync=false --json-file-output=../snyk-frontend.json
      - name: Upload Snyk Frontend JSON
        if: always() && steps.check_secret.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-report
          retention-days: 7
          path: snyk-frontend.json

  snyk-backend:
    name: Snyk Backend Scan
    runs-on: ubuntu-latest
    environment:
      name: quality
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 20
    needs: [backend-sbom]
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check if SNYK_TOKEN is configured
        id: check_secret
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SNYK_TOKEN not set; skipping Snyk backend scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Download Backend Requirements
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-sbom
          path: backend
      - name: Run Snyk CLI via Container
        if: steps.check_secret.outputs.enabled == 'true'
        uses: docker://snyk/snyk:python-3.13
        with:
          entrypoint: /bin/sh
          args: >
            -c "cd backend && snyk test --file=requirements.txt --package-manager=pip
            --json-file-output=../snyk-backend.json -- --allow-missing"
      - name: Upload Snyk Backend JSON
        if: always() && steps.check_secret.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-backend-report
          retention-days: 7
          path: snyk-backend.json

  # ===========================================================================
  # Stage: Build & Container Scanning (Backend & Frontend Images)
  # ===========================================================================
  docker-build-and-scan:
    name: Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    needs: [backend-test, frontend-test]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set image reference for scanning
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "ref=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Set up pinned Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2
          cache: true

      - name: Scan container image once (Trivy JSON)
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --format json \
            --output "trivy-container-${{ matrix.service }}.json" \
            "$IMAGE_REF"

      - name: Convert Trivy JSON to SARIF and CycloneDX
        run: |
          set -euo pipefail
          trivy convert \
            --format sarif \
            --output "cs-${{ matrix.service }}.sarif" \
            "trivy-container-${{ matrix.service }}.json"
          trivy convert \
            --format cyclonedx \
            --output "sbom-container-${{ matrix.service }}.cdx.json" \
            "trivy-container-${{ matrix.service }}.json"

      - name: Upload Container Scan SARIF to GitHub Security
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cs-${{ matrix.service }}.sarif
          category: container-${{ matrix.service }}

      - name: Upload Container SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-sbom-${{ matrix.service }}
          retention-days: 7
          path: |
            sbom-container-${{ matrix.service }}.cdx.json
            trivy-container-${{ matrix.service }}.json

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image tags to GHCR
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [ -z "$image" ] || docker push "$image"
          done <<< "$IMAGE_TAGS"

  # ===========================================================================
  # Stage: Report (Grouped SBOM & CVE HTML Reports via Trivy)
  # ===========================================================================
  trivy-sbom-cve-reports:
    name: Grouped SBOM & CVE HTML Reports
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch))
    timeout-minutes: 20
    needs: [frontend-sbom, backend-sbom, docker-build-and-scan]
    steps:
      - name: Download All SBOM Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-sbom*'
          path: downloaded-sboms

      - name: Generate CVE reports from Trivy JSON
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2
          TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
        run: |
          set -euo pipefail
          mkdir -p reports "$TRIVY_CACHE"
          items=(
            "frontend-app:sbom:downloaded-sboms/frontend-sbom/frontend-sbom.cdx.json"
            "backend-app:sbom:downloaded-sboms/backend-sbom/sbom-backend-cdx.json"
            "backend-container:json:downloaded-sboms/container-sbom-backend/trivy-container-backend.json"
            "frontend-container:json:downloaded-sboms/container-sbom-frontend/trivy-container-frontend.json"
          )

          for item in "${items[@]}"; do
            name="${item%%:*}"
            details="${item#*:}"
            input_type="${details%%:*}"
            file="${details#*:}"
            json_report="reports/${name}-report.json"
            html_report="reports/${name}-report.html"

            if [[ ! -f "$file" ]]; then
              echo "::warning title=Missing Trivy input::Skipping ${name}; ${file} was not downloaded."
              continue
            fi

            echo "::group::Generate ${name} Trivy report"
            echo "Input: ${file} (${input_type})"
            if [[ "$input_type" == "sbom" ]]; then
              docker run --rm \
                --volume "$GITHUB_WORKSPACE:/workspace" \
                --volume "$TRIVY_CACHE:/root/.cache/trivy" \
                --workdir /workspace \
                "$TRIVY_IMAGE" \
                sbom "/workspace/${file}" \
                --format json \
                --output "/workspace/${json_report}"
            else
              cp "$file" "$json_report"
            fi
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              "$TRIVY_IMAGE" \
              convert "/workspace/${json_report}" \
              --format template \
              --template "@/contrib/html.tpl" \
              --output "/workspace/${html_report}"
            echo "JSON report: ${json_report}"
            echo "HTML report: ${html_report}"
            echo "::endgroup::"
          done
      - name: Add CVE severity summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          severities = ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN")
          report_paths = sorted(Path("reports").glob("*-report.json"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def markdown_cell(value: object) -> str:
              return str(value).replace("|", "\\|").replace("\n", " ").strip()

          with summary.open("a", encoding="utf-8") as output:
              output.write("## Trivy CVE findings by component\n\n")
              if not report_paths:
                  output.write("No Trivy JSON reports were generated.\n\n")
              else:
                  output.write("| Component | Critical | High | Medium | Low | Unknown | Total |\n")
                  output.write("| --- | ---: | ---: | ---: | ---: | ---: | ---: |\n")
                  totals = Counter()
                  findings_by_component = []

                  for path in report_paths:
                      report = json.loads(path.read_text(encoding="utf-8"))
                      findings = [
                          finding
                          for result in report.get("Results") or []
                          for finding in result.get("Vulnerabilities") or []
                      ]
                      counts = Counter()
                      for finding in findings:
                          severity = finding.get("Severity", "UNKNOWN").upper()
                          counts[severity if severity in severities else "UNKNOWN"] += 1
                      totals.update(counts)
                      component = path.name.removesuffix("-report.json")
                      output.write(
                          f"| {component} | "
                          + " | ".join(str(counts[level]) for level in severities)
                          + f" | {len(findings)} |\n"
                      )
                      findings_by_component.append((component, findings))

                  output.write(
                      f"| **Total findings** | "
                      + " | ".join(str(totals[level]) for level in severities)
                      + f" | **{sum(totals.values())}** |\n\n"
                  )

                  notable = [
                      (component, finding)
                      for component, findings in findings_by_component
                      for finding in findings
                      if finding.get("Severity", "").upper() in ("CRITICAL", "HIGH")
                  ]
                  if notable:
                      output.write("### Critical and high severity findings\n\n")
                      output.write("| Component | Severity | CVE | Package | Installed | Fixed in |\n")
                      output.write("| --- | --- | --- | --- | --- | --- |\n")
                      for component, finding in notable[:25]:
                          output.write(
                              f"| {markdown_cell(component)} "
                              f"| {markdown_cell(finding.get('Severity', 'UNKNOWN'))} "
                              f"| {markdown_cell(finding.get('VulnerabilityID', 'N/A'))} "
                              f"| {markdown_cell(finding.get('PkgName', 'N/A'))} "
                              f"| {markdown_cell(finding.get('InstalledVersion', 'N/A'))} "
                              f"| {markdown_cell(finding.get('FixedVersion') or 'N/A')} |\n"
                          )
                      output.write("\n")
                  else:
                      output.write("No critical or high severity findings in generated reports.\n\n")

              output.write(
                  "These findings are informational; Trivy reports are downloadable in "
                  "the `grouped-sbom-cve-html-reports` artifact.\n"
              )
          PY

      - name: Upload Grouped HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-sbom-cve-html-reports
          retention-days: 14
          path: reports/

  # ===========================================================================
  # Stage: Deploy (Self-Hosted Runner Environment & Smoke Tests)
  # ===========================================================================
  deploy:
    name: Deploy to Local Environment
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
    needs: [docker-build-and-scan]
    if: >
      needs.docker-build-and-scan.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref_type == 'branch') ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'deploy' &&
          github.ref_name == github.event.repository.default_branch
        )
      )
    timeout-minutes: 15
    concurrency:
      group: counter-app-local
      cancel-in-progress: false
    environment:
      name: local
      url: http://localhost:3000
    env:
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "3000"
      CI_REGISTRY: ghcr.io
      DEPLOY_IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GHCR image path
        id: registry
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Check local runner and Docker
        run: |
          echo "::notice title=Runner::Preparing local Docker deployment on $(hostname)"
          docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
          docker compose version
          docker info --format 'Docker daemon: {{.ServerVersion}}'
      - name: Deploy application
        env:
          CI_REGISTRY_IMAGE: ${{ steps.registry.outputs.image }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash deploy/deploy.sh
      - name: Smoke test backend
        run: |
          echo "Checking backend health at http://localhost:${BACKEND_PORT}/health"
          curl --show-error --fail --retry 10 --retry-delay 2 --retry-connrefused \
            --write-out 'Backend responded with HTTP %{http_code} in %{time_total}s\n' \
            "http://localhost:${BACKEND_PORT}/health"
      - name: Smoke test frontend
        run: |
          echo "Checking frontend at http://localhost:${FRONTEND_PORT}"
          for attempt in $(seq 1 15); do
            if curl --silent --show-error --fail \
              --write-out 'Frontend responded with HTTP %{http_code} in %{time_total}s\n' \
              "http://localhost:${FRONTEND_PORT}" --output /dev/null; then
              echo "Frontend health check passed on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "ERROR: Frontend failed to respond on port ${FRONTEND_PORT} after 15 attempts." >&2
              curl -v "http://localhost:${FRONTEND_PORT}" || true
              exit 1
            fi
            sleep 2
          done
          echo "Both application smoke tests passed."

  undeploy:
    name: Undeploy Local Environment
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
    needs: [docker-build-and-scan, deploy]
    if: >
      always() &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'undeploy' &&
          github.ref_name == github.event.repository.default_branch
        ) ||
        (
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          needs.docker-build-and-scan.result == 'success' &&
          needs.deploy.result != 'skipped'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'deploy' &&
          needs.docker-build-and-scan.result == 'success' &&
          needs.deploy.result != 'skipped'
        )
      )
    timeout-minutes: 15
    concurrency:
      group: counter-app-local
      cancel-in-progress: false
    environment:
      name: local
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check local runner and Docker
        run: |
          echo "::notice title=Runner::Preparing local Docker undeploy on $(hostname)"
          docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
          docker compose version
          docker info --format 'Docker daemon: {{.ServerVersion}}'
      - name: Run Undeploy Script
        run: bash deploy/undeploy.sh

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-scripts
      - codeql-sast
      - secret-detection
      - dependency-review
      - backend-test
      - frontend-test
      - frontend-sbom
      - backend-sbom
      - sonarqube
      - snyk-frontend
      - snyk-backend
      - docker-build-and-scan
      - trivy-sbom-cve-reports
      - deploy
      - undeploy
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Publish job results
        run: |
          {
            echo "## CounterApp CI/CD"
            echo
            echo "**Event:** \`${EVENT_NAME}\` · **Ref:** \`${REF_NAME}\`"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            printf '%s\n' "$NEEDS_JSON" \
              | jq -r 'to_entries | sort_by(.key)[] | "| `\(.key)` | **\(.value.result)** |"'
            echo
            echo "[Open this workflow run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"