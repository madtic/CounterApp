name: CounterApp CI/CD GitHub

on:
  push:
    branches:
      - '**'      #[ "main", "master", "Vorlesung" ]
    tags:
      - '**'      #[ "main", "master", "Vorlesung" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual deployment action (deploy or undeploy)'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - undeploy

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ===========================================================================
  # Stage: Test & Native GitHub Security Analysis
  # ===========================================================================
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ShellCheck
        run: shellcheck deploy/*.sh sonarqube.sh

  codeql-sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

  secret-detection:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  backend-test:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (Ruff) & Type Check (ty)
        run: |
          uv run ruff check --output-format=github .
          uv run ty check
      - name: Run Pytest with Coverage & JUnit
        run: |
          uv run pytest -v --durations=10 \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term \
            --junitxml=pytest-report.xml \
            --junit-prefix=backend
      - name: Upload Backend Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          retention-days: 7
          path: |
            backend/coverage.xml
            backend/pytest-report.xml
            backend/htmlcov/

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build
        run: |
          npm ci
          npm run build
      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          retention-days: 7
          path: frontend/dist/

  # ===========================================================================
  # Stage: Quality (SBOM, SonarQube, Snyk)
  # ===========================================================================
  frontend-sbom:
    name: Frontend SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Frontend SBOM
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-file frontend-sbom.cdx.json
      - name: Upload Frontend SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          retention-days: 7
          path: frontend/frontend-sbom.cdx.json

  backend-sbom:
    name: Backend SBOM & Requirements
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Export Backend SBOM & requirements.txt
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format cyclonedx1.5 -o sbom-backend-cdx.json
          uv export --frozen --no-dev --no-hashes --format requirements.txt -o requirements.txt
      - name: Upload Backend SBOM & Requirements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          retention-days: 7
          path: |
            backend/sbom-backend-cdx.json
            backend/requirements.txt

  sonarqube:
    name: SonarQube Analysis
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch))
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [backend-test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Check if SONAR_TOKEN is configured
        id: check_secret
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SONAR_TOKEN not set; skipping SonarQube analysis."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python 3.13
        if: steps.check_secret.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Download Backend Coverage
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: backend
      - name: Check local runner and SonarQube
        if: steps.check_secret.outputs.enabled == 'true'
        run: |
          echo "::notice title=Runner::Preparing SonarQube analysis on $(hostname)"
          uv --version
          python --version
          sonar_url="${SONAR_HOST_URL%/}"
          status="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "${sonar_url}/api/system/status")"
          printf 'SonarQube status: %s\n' "$status"
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <<< "$status"; then
            echo "ERROR: SonarQube is reachable but is not UP." >&2
            exit 1
          fi
      - name: Run pysonar
        if: steps.check_secret.outputs.enabled == 'true'
        run: |
          if [ ! -f backend/coverage.xml ]; then
            echo "ERROR: backend/coverage.xml was not downloaded." >&2
            exit 1
          fi
          echo "::notice title=SonarQube::Analyzing against ${SONAR_HOST_URL}"
          if [ -n "${SONAR_ORGANIZATION:-}" ]; then
            uv run --project backend pysonar \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.organization="${SONAR_ORGANIZATION}"
          else
            uv run --project backend pysonar -Dsonar.host.url="${SONAR_HOST_URL}"
          fi

  snyk-frontend:
    name: Snyk Frontend Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 20
    needs: [frontend-test]
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check if SNYK_TOKEN is configured
        id: check_secret
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SNYK_TOKEN not set; skipping Snyk frontend scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Set up Node 22
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies & Run Snyk
        if: steps.check_secret.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npx --yes snyk test --strict-out-of-sync=false --json-file-output=../snyk-frontend.json
      - name: Upload Snyk Frontend JSON
        if: always() && steps.check_secret.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-report
          retention-days: 7
          path: snyk-frontend.json

  snyk-backend:
    name: Snyk Backend Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 20
    needs: [backend-sbom]
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check if SNYK_TOKEN is configured
        id: check_secret
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SNYK_TOKEN not set; skipping Snyk backend scan."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check_secret.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: Download Backend Requirements
        if: steps.check_secret.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-sbom
          path: backend
      - name: Run Snyk CLI via Container
        if: steps.check_secret.outputs.enabled == 'true'
        uses: docker://snyk/snyk:python-3.13
        with:
          entrypoint: /bin/sh
          args: >
            -c "cd backend && snyk test --file=requirements.txt --package-manager=pip
            --json-file-output=../snyk-backend.json -- --allow-missing"
      - name: Upload Snyk Backend JSON
        if: always() && steps.check_secret.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-backend-report
          retention-days: 7
          path: snyk-backend.json

  # ===========================================================================
  # Stage: Build & Container Scanning (Backend & Frontend Images)
  # ===========================================================================
  docker-build-and-scan:
    name: Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch)
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    needs: [backend-test, frontend-test]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set image reference for scanning
        id: image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "ref=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate Container SBOM (CycloneDX via Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: sbom-container-${{ matrix.service }}.cdx.json

      - name: Container Vulnerability Scan (SARIF for GitHub Security Tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: cs-${{ matrix.service }}.sarif

      - name: Upload Container Scan SARIF to GitHub Security
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cs-${{ matrix.service }}.sarif
          category: container-${{ matrix.service }}

      - name: Upload Container SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-sbom-${{ matrix.service }}
          retention-days: 7
          path: sbom-container-${{ matrix.service }}.cdx.json

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image tags to GHCR
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [ -z "$image" ] || docker push "$image"
          done <<< "$IMAGE_TAGS"

  # ===========================================================================
  # Stage: Report (Grouped SBOM & CVE HTML Reports via Trivy)
  # ===========================================================================
  trivy-sbom-cve-reports:
    name: Grouped SBOM & CVE HTML Reports
    runs-on: ubuntu-latest
    if: always() && (github.event_name != 'workflow_dispatch' || (inputs.action == 'deploy' && github.ref_name == github.event.repository.default_branch))
    timeout-minutes: 20
    needs: [frontend-sbom, backend-sbom, docker-build-and-scan]
    steps:
      - name: Download All SBOM Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-sbom*'
          path: downloaded-sboms

      - name: Generate Trivy SBOM + CVE HTML Reports
        uses: docker://aquasec/trivy:latest
        with:
          entrypoint: /bin/sh
          args: >
            -c '
              mkdir -p reports
              for item in \
                "frontend-app:downloaded-sboms/frontend-sbom/frontend-sbom.cdx.json" \
                "backend-app:downloaded-sboms/backend-sbom/sbom-backend-cdx.json" \
                "backend-container:downloaded-sboms/container-sbom-backend/sbom-container-backend.cdx.json" \
                "frontend-container:downloaded-sboms/container-sbom-frontend/sbom-container-frontend.cdx.json"; do
                NAME="${item%%:*}"
                FILE="${item#*:}"
                if [ -f "$FILE" ]; then
                  echo "Generating Trivy SBOM + CVE HTML report for ${NAME} (${FILE})..."
                  trivy sbom "$FILE" \
                    --format template \
                    --template "@/contrib/html.tpl" \
                    --output "reports/${NAME}-report.html"
                else
                  echo "Skipping ${NAME}: ${FILE} not found."
                fi
              done
            '

      - name: Upload Grouped HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-sbom-cve-html-reports
          retention-days: 14
          path: reports/

  # ===========================================================================
  # Stage: Deploy (Self-Hosted Runner Environment & Smoke Tests)
  # ===========================================================================
  deploy:
    name: Deploy to Local Environment
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
    needs: [docker-build-and-scan, trivy-sbom-cve-reports]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'deploy' &&
      github.ref_name == github.event.repository.default_branch
    timeout-minutes: 15
    concurrency:
      group: counter-app-local
      cancel-in-progress: false
    environment:
      name: local
      url: http://localhost:3000
    env:
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "3000"
      CI_REGISTRY: ghcr.io
      DEPLOY_IMAGE_TAG: ${{ github.sha }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GHCR image path
        id: registry
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Check local runner and Docker
        run: |
          echo "::notice title=Runner::Preparing local Docker deployment on $(hostname)"
          docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
          docker compose version
          docker info --format 'Docker daemon: {{.ServerVersion}}'
      - name: Deploy application
        env:
          CI_REGISTRY_IMAGE: ${{ steps.registry.outputs.image }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash deploy/deploy.sh
      - name: Smoke test backend
        run: |
          echo "Checking backend health at http://localhost:${BACKEND_PORT}/health"
          curl --show-error --fail --retry 10 --retry-delay 2 --retry-connrefused \
            --write-out 'Backend responded with HTTP %{http_code} in %{time_total}s\n' \
            "http://localhost:${BACKEND_PORT}/health"
      - name: Smoke test frontend
        run: |
          echo "Checking frontend at http://localhost:${FRONTEND_PORT}"
          for attempt in $(seq 1 15); do
            if curl --silent --show-error --fail \
              --write-out 'Frontend responded with HTTP %{http_code} in %{time_total}s\n' \
              "http://localhost:${FRONTEND_PORT}" --output /dev/null; then
              echo "Frontend health check passed on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "ERROR: Frontend failed to respond on port ${FRONTEND_PORT} after 15 attempts." >&2
              curl -v "http://localhost:${FRONTEND_PORT}" || true
              exit 1
            fi
            sleep 2
          done
          echo "Both application smoke tests passed."

  undeploy:
    name: Undeploy Local Environment
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        shell: bash
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'undeploy' &&
      github.ref_name == github.event.repository.default_branch
    timeout-minutes: 15
    concurrency:
      group: counter-app-local
      cancel-in-progress: false
    environment:
      name: local
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check local runner and Docker
        run: |
          echo "::notice title=Runner::Preparing local Docker undeploy on $(hostname)"
          docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
          docker compose version
          docker info --format 'Docker daemon: {{.ServerVersion}}'
      - name: Run Undeploy Script
        run: bash deploy/undeploy.sh

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-scripts
      - codeql-sast
      - secret-detection
      - dependency-review
      - backend-test
      - frontend-test
      - frontend-sbom
      - backend-sbom
      - sonarqube
      - snyk-frontend
      - snyk-backend
      - docker-build-and-scan
      - trivy-sbom-cve-reports
      - deploy
      - undeploy
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Publish job results
        run: |
          {
            echo "## CounterApp CI/CD"
            echo
            echo "**Event:** \`${EVENT_NAME}\` · **Ref:** \`${REF_NAME}\`"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            printf '%s\n' "$NEEDS_JSON" \
              | jq -r 'to_entries | sort_by(.key)[] | "| `\(.key)` | **\(.value.result)** |"'
            echo
            echo "[Open this workflow run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"